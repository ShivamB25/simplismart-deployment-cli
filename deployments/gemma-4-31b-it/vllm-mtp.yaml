# Simplismart BYOC manifest consumed by `simplismart-deploy deploy`.
# The CLI resolves deployment.modelRepoName to a ModelRepo UUID before creation.
# Credentials are injected from the environment or ignored .env file.
#
# Tuned for one H100: high concurrent text-to-text traffic with low TTFT.
# Uses a 16K context ceiling to preserve KV-cache capacity for concurrency.
# Concurrent partial prefill is intentionally omitted because Gemma 4 + MTP
# rejects max-num-partial-prefills > 1 in vLLM 0.26.0.
# Credentials are injected at provision time; never commit values.
apiVersion: simplismart.ai/byoc/v1alpha1
metadata:
  name: zapim-gemma4-31b-it-vllm-mtp
  model: google/gemma-4-31B-it
modelRepository:
  name: gemma4-31b-it-vllm-v0-26-0
  sourceType: docker_hub
  registryPath: vllm/vllm-openai
  dockerTag: v0.26.0-cu129
  runtimeGpus: 1
  healthcheck: &healthcheck
    path: /health
    port: 8000
    initialDelaySeconds: 900
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 300
  ports: &ports
    http:
      port: 8000
  metricsPath: &metricsPath
    - /v1/chat/completions
  env: &env
    BENCHMARK_API_KEY: ${BENCHMARK_API_KEY}
    VLLM_API_KEY: ${BENCHMARK_API_KEY}
    HF_TOKEN: ${HF_TOKEN}
  deploymentCustomConfiguration: &command
    command:
      - vllm
      - serve
      - google/gemma-4-31B-it
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --dtype
      - bfloat16
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.92"
      - --max-num-seqs
      - "32"
      - --max-num-batched-tokens
      - "16384"
      - --long-prefill-token-threshold
      - "4096"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --speculative-config.method
      - mtp
      - --speculative-config.model
      - google/gemma-4-31B-it-assistant
      - --speculative-config.num_speculative_tokens
      - "1"
deployment:
  name: zapim-gemma4-31b-it-vllm-mtp
  modelRepoName: gemma4-31b-it-vllm-v0-26-0
  gpuId: nvidia-h100
  minPodReplicas: 1
  maxPodReplicas: 1
  authEnabled: false
  envVariables: *env
  healthcheck: *healthcheck
  ports: *ports
  metricsPath: *metricsPath
  deploymentCustomConfiguration: *command
