# Simplismart BYOC manifest consumed by `simplismart-deploy deploy`.
# The CLI resolves deployment.modelRepoName to a ModelRepo UUID before creation.
# Prefix caching: RadixAttention ON (default). Qwen hybrid uses mamba-radix extra_buffer.
# Shared benchmark key is also set as env so it is visible in the Simplismart UI.
# Engine auth uses SGLang --api-key (literal argv value; not shell-expanded).
# Simplismart gateway auth is disabled so clients only need this one key.
apiVersion: simplismart.ai/byoc/v1alpha1
metadata:
  name: zapim-qwen36-35b-a3b-fp8
  model: Qwen/Qwen3.6-35B-A3B-FP8
modelRepository:
  name: qwen36-35b-a3b-fp8-sglang-v0-5-15
  sourceType: docker_hub
  registryPath: lmsysorg/sglang
  dockerTag: v0.5.15
  runtimeGpus: 1
  healthcheck: &healthcheck
    path: /health
    port: 8000
    initialDelaySeconds: 600
    periodSeconds: 10
    timeoutSeconds: 5
  ports: &ports
    http:
      port: 8000
  metricsPath: &metricsPath
    - /v1/chat/completions
  env: &env
    BENCHMARK_API_KEY: ${BENCHMARK_API_KEY}
  deploymentCustomConfiguration: &command
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - Qwen/Qwen3.6-35B-A3B-FP8
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --radix-eviction-policy
      - lru
      - --mamba-radix-cache-strategy
      - extra_buffer
      - --page-size
      - "64"
      - --api-key
      - ${BENCHMARK_API_KEY}
      - --tp
      - "1"
      - --context-length
      - "131072"
      - --mem-fraction-static
      - "0.8"
      - --chunked-prefill-size
      - "8192"
      - --max-running-requests
      - "256"
      - --cuda-graph-max-bs-decode
      - "256"
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --speculative-algo
      - NEXTN
      - --speculative-num-steps
      - "3"
      - --speculative-eagle-topk
      - "1"
      - --speculative-num-draft-tokens
      - "4"
      - --watchdog-timeout
      - "1200"
      - --model-loader-extra-config
      - '{"enable_multithread_load":true,"num_threads":64}'
deployment:
  name: zapim-qwen36-35b-a3b-fp8
  modelRepoName: qwen36-35b-a3b-fp8-sglang-v0-5-15
  gpuId: nvidia-h100
  minPodReplicas: 1
  maxPodReplicas: 1
  authEnabled: false
  envVariables: *env
  healthcheck: *healthcheck
  ports: *ports
  metricsPath: *metricsPath
  deploymentCustomConfiguration: *command
