# Simplismart BYOC manifest consumed by `simplismart-deploy deploy`.
# The CLI resolves deployment.modelRepoName to a ModelRepo UUID before creation.
# Credentials are injected from the environment or ignored .env file.
#
# vLLM 0.26.0 CUDA 12.9 supports native Gemma 4 MTP through the official
# gemma4_assistant checkpoint and dotted speculative-config arguments.
#
# Inject credentials at deployment time; never commit live values.
apiVersion: simplismart.ai/byoc/v1alpha1
metadata:
  name: zapim-gemma4-26b-a4b-it-vllm-mtp-v1
  model: google/gemma-4-26B-A4B-it
modelRepository:
  name: gemma4-26b-a4b-it-vllm-v0-26-0
  sourceType: docker_hub
  registryPath: vllm/vllm-openai
  dockerTag: v0.26.0-cu129
  runtimeGpus: 1
  healthcheck: &healthcheck
    path: /health
    port: 8000
    initialDelaySeconds: 900
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 300
  ports: &ports
    http:
      port: 8000
  metricsPath: &metricsPath
    - /v1/chat/completions
  env: &env
    BENCHMARK_API_KEY: ${BENCHMARK_API_KEY}
    VLLM_API_KEY: ${BENCHMARK_API_KEY}
    HF_TOKEN: ${HF_TOKEN}
  deploymentCustomConfiguration: &command
    command:
      - vllm
      - serve
      - google/gemma-4-26B-A4B-it
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --dtype
      - bfloat16
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.90"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "16384"
      - --long-prefill-token-threshold
      - "8192"
      - --max-num-partial-prefills
      - "2"
      - --max-long-partial-prefills
      - "1"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --speculative-config.method
      - mtp
      - --speculative-config.model
      - google/gemma-4-26B-A4B-it-assistant
      - --speculative-config.num_speculative_tokens
      - "1"
deployment:
  name: zapim-gemma4-26b-a4b-it-vllm-mtp-v1
  modelRepoName: gemma4-26b-a4b-it-vllm-v0-26-0
  gpuId: nvidia-h100
  minPodReplicas: 1
  maxPodReplicas: 1
  authEnabled: false
  envVariables: *env
  healthcheck: *healthcheck
  ports: *ports
  metricsPath: *metricsPath
  deploymentCustomConfiguration: *command
